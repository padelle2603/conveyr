<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- morph field: squircle halfway between circle and square -->
  <rect x="136" y="136" width="240" height="240" rx="86" fill="#ffffff" opacity="0.30"/>

  <!-- circle -->
  <circle cx="196" cy="256" r="86" fill="#ffffff"/>

  <!-- square -->
  <rect x="244" y="170" width="172" height="172" rx="50" fill="#ffffff"/>

  <!-- accent dots -->
  <circle cx="118" cy="138" r="10" fill="#ffffff" opacity="0.55"/>
  <circle cx="400" cy="382" r="7" fill="#ffffff" opacity="0.45"/>
</svg>